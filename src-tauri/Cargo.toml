[package]
name = "edugame-studio-tauri"
# Phiên bản theo dõi app Electron đang có; bump cùng lúc với package.json khi phát hành.
version = "0.5.1"
description = "EduGame Studio - vỏ Tauri (thử nghiệm giai đoạn 1)"
authors = ["EduGame Studio"]
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
# Windows cần một lib rlib cho binary gọi vào, chuẩn của Tauri v2.
name = "edugame_studio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: cổng nghiệm thu của giai đoạn 1 đo UI trong WebView2 qua CDP, và
# Tauri không mở cổng gỡ lỗi nếu thiếu cờ tính năng này.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Giai đoạn 3: thư viện và sidecar của renderer sống trong `edugame.sqlite` y như
# bản Electron. `bundled` biên dịch SQLite kèm theo, nên máy Windows của giáo viên
# không cần cài DLL nào và bản build không phụ thuộc phiên bản SQLite của hệ điều
# hành. Chọn `rusqlite` thay vì `tauri-plugin-sql`: cùng một file, cùng SQL, nhưng
# mở trực tiếp trong Rust để ném lỗi tiếng Việt có mã, giữ transaction tường minh
# và kiểm bằng `cargo test` — không thêm một lớp cầu IPC thứ hai.
rusqlite = { version = "0.41", features = ["bundled"] }
deno_core = { version = "0.413.0", default-features = false, features = ["v8", "reactor-tokio"] }
deno_error = "0.7.1"
tokio = { version = "1", features = ["rt", "macros"] }
# Gói `.egame`: hộp thoại mở/lưu là của TIẾN TRÌNH (Rust), không của WebView —
# frontend không có quyền `dialog:`/`fs:`, nên nó không tự chọn được đường dẫn.
tauri-plugin-dialog = "2"
# Id ảnh minh hoạ (`ci-` + 32 hex) lấy từ nguồn ngẫu nhiên của hệ điều hành: id
# đoán được thì một tệp trong `images/` có thể bị dò bằng URL `edugame-file:`.
getrandom = "0.3"
# Giai đoạn 4: bản sao lưu profile Electron ghi kèm SHA-256 của từng tệp, và bước
# nhập chỉ báo thành công sau khi đối chiếu lại. Hai crate đã có trong cây phụ
# thuộc (qua tauri/rusqlite); khai trực tiếp để không dựa vào một đường gián tiếp.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Thư mục tạm tự dọn cho test storage: mỗi test mở một tệp 0.5.1 riêng, không
# bao giờ chạm thư mục dữ liệu thật.
tempfile = "3"

[profile.release]
# Installer là một trong ba ngưỡng ngừng Electron (#251), nên tối ưu kích thước ngay
# từ giai đoạn 1 thay vì phải sửa profile về sau.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

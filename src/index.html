<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https: http://127.0.0.1:* http://localhost:*;">
  <title>EduGame Studio</title>
  <!-- G5 (2026-10-19): app.css là stylesheet DUY NHẤT (Tailwind v4 + các rule
       component ported từ 5 file legacy đã xóa). Utility @layer utilities thắng
       @layer components; state class JS-toggle và hệ thống chưa migrate sống
       trong components layer của app.css. -->
  <link rel="stylesheet" href="renderer/styles/app.css">
</head>
<body>
  <!-- G2 (shell): các block bên dưới đã migrate sang utility. Class cũ được giữ lại
       làm hook cho JS/CDP (.app-shell, .nav-item, .active, .toast, các #id) —
       quy tắc style cũ của chúng trong layout.css/responsive.css đã bị xóa. -->
  <div class="app-shell flex min-h-screen">
    <aside class="sidebar w-[252px] max-wide:w-[220px] max-tab:w-[190px] max-compact:w-16 shrink-0 flex flex-col bg-white border-r border-line pt-[26px] px-4 pb-[18px] max-tab:px-2.5 max-compact:p-[20px_7px]">
      <div class="brand flex items-center gap-[11px] px-[9px] pb-[35px] max-compact:px-1.5 max-compact:pb-7">
        <div class="brand-mark w-[38px] h-[38px] rounded-xl bg-[linear-gradient(145deg,#786dff,#5145d6)] grid place-items-center text-white text-[24px] shadow-[0_6px_15px_#6258e83b] max-compact:shrink-0"><span>✦</span></div>
        <div class="max-compact:hidden"><div class="brand-name text-[17px] max-tab:text-[14px] [font-weight:750] tracking-[-0.5px]">EduGame <b class="text-brand">Studio</b></div><div class="brand-sub text-[8px] text-[#9aa1b2] tracking-[1.5px] mt-[3px] font-bold">LEARNING GAME BUILDER</div></div>
      </div>
      <div class="workspace-label text-[9px] font-extrabold tracking-[1.2px] text-[#a0a6b5] px-3 pb-3 max-compact:hidden">KHÔNG GIAN LÀM VIỆC</div>
      <nav class="nav grid gap-[5px]">
        <button class="nav-item active flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="home"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">⌂</span><span class="max-compact:hidden">Tổng quan</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="library"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">▦</span><span class="max-compact:hidden">Thư viện trò chơi</span><span class="nav-count ml-auto bg-white border border-[#e3e3fb] rounded-md px-[7px] py-[2px] text-[11px] max-compact:hidden" id="navGameCount">1</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="create-wizard" title="Nhập giáo án để AI local phân tích và gợi ý trò chơi"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">🪄</span><span class="max-compact:hidden">Tạo từ giáo án</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="create" title="Tôi đã biết muốn tạo trò chơi nào"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">✳</span><span class="max-compact:hidden">Tạo trò chơi</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="lesson-plans"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">📄</span><span class="max-compact:hidden">Giáo án</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="my-projects"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">📁</span><span class="max-compact:hidden">Dự án của tôi</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="sessions"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">◷</span><span class="max-compact:hidden">Lịch sử kết quả</span></button>
      </nav>
      <div class="sidebar-bottom mt-auto">
        <div class="offline-card flex gap-2.5 items-start py-[13px] px-3 bg-[#effaf5] border border-[#ddf4e8] rounded-xl mt-[18px] mx-[2px] mb-[15px] max-compact:hidden"><div class="offline-dot w-2 h-2 bg-[#1ab47f] rounded-full mt-[5px] shadow-[0_0_0_4px_#d8f5e8]"></div><div><strong class="block text-[11px]">Sẵn sàng ngoại tuyến</strong><small class="block text-[10px] text-[#879183] mt-1">Game đã lưu vẫn chơi được</small></div></div>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#717b90] transition duration-150 hover:bg-[#f6f6ff] hover:text-brand [&.active]:bg-brand-soft [&.active]:text-brand max-compact:justify-center max-compact:px-0" data-page="settings"><span class="nav-icon w-5 text-center text-[19px] font-normal max-compact:text-[20px]">⚙</span><span class="max-compact:hidden">Cài đặt</span></button>
        <div class="profile border-t border-line mt-4 pt-[17px] px-[5px] pb-0 flex items-center gap-[9px] max-compact:justify-center"><div class="avatar w-[34px] h-[34px] rounded-[11px] bg-[#e8e6ff] text-brand font-extrabold grid place-items-center text-[11px]">GV</div><div class="max-compact:hidden"><strong class="block text-[11px]">Không gian giáo viên</strong><small class="block text-[10px] text-[#879183] mt-1">Máy tính này</small></div><span class="profile-more ml-auto text-[#a0a6b5] tracking-[2px] max-compact:hidden">•••</span></div>
      </div>
    </aside>
    <main class="main min-w-0 flex-1">
      <header class="topbar h-[72px] bg-white border-b border-line flex items-center justify-between px-[34px] max-wide:px-6 max-compact:px-[15px]">
        <div class="breadcrumb flex gap-2.5 items-center text-[#9299aa] text-[12px]"><span>EduGame Studio</span><span class="crumb-sep text-[#d3d6e0]">/</span><strong id="pageCrumb" class="text-[#30384b] [font-weight:650]">Tổng quan</strong></div>
        <div class="top-actions flex items-center gap-[15px]"><span class="local-pill text-[11px] text-[#6f7a8d] bg-[#f7f8fb] border border-[#e9ecf3] py-2 px-[11px] rounded-lg"><i class="inline-block w-1.5 h-1.5 bg-[#18ae7b] rounded-full mr-1.5"></i> Lưu trên thiết bị</span><button class="icon-button w-[31px] h-[31px] border border-line rounded-[9px] bg-white text-muted font-bold" id="helpBtn" title="Hướng dẫn">?</button><div class="top-avatar w-8 h-8 rounded-full bg-[#e8e6ff] text-brand font-extrabold grid place-items-center text-[11px]">GV</div></div>
      </header>
      <div id="pageContent" class="page-content max-w-[1500px] mx-auto pt-[30px] px-[34px] pb-12 max-wide:p-[25px_24px] max-compact:p-5 max-compact:px-[14px]"></div>
      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="renderer/shared.js"></script>
  <script src="renderer/pages/home.js"></script>
  <script src="renderer/pages/library.js"></script>
  <script src="renderer/pages/create.js"></script>
  <script src="renderer/pages/sessions.js"></script>
  <script src="renderer/pages/settings.js"></script>
  <script src="renderer/pages/lesson-plans.js"></script>
  <script src="renderer/pages/my-projects.js"></script>
  <script src="renderer/features/wizard/state.js"></script>
  <script src="renderer/features/wizard/step-input.js"></script>
  <script src="renderer/features/wizard/step-analysis.js"></script>
  <script src="renderer/features/wizard/step-recommend.js"></script>
  <script src="renderer/features/wizard/step-configure.js"></script>
  <script src="renderer/features/wizard/step-generate.js"></script>
  <script src="renderer/pages/create-wizard.js"></script>
  <script src="renderer/core/render.js"></script>
  <script src="renderer/features/game-editor.js"></script>
  <script src="renderer/core/controller.js"></script>
  <script src="renderer/features/local-ai.js"></script>
  <script src="renderer/features/game-generation.js"></script>
  <script src="game-engine/runtime.js"></script>
  <script src="renderer/features/gameplay.js"></script>
  <script src="renderer/features/results.js"></script>
  <script src="renderer/features/settings.js"></script>
  <script src="renderer/core/bootstrap.js"></script>
</body>
</html>

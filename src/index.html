<!doctype html>
<html lang="vi" data-fullscreen="0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: edugame-file:; connect-src https: http://127.0.0.1:* http://localhost:*;">
  <title>EduGame Studio</title>
  <!-- G5 (2026-10-19): app.css là stylesheet DUY NHẤT (Tailwind v4 + các rule
       component ported từ 5 file legacy đã xóa). Utility @layer utilities thắng
       @layer components; state class JS-toggle và hệ thống chưa migrate sống
       trong components layer. Từ DECISIONS #149 app.css chỉ là entry: nó @import
       13 file khu vực trong renderer/styles/ theo thứ tự cascade. -->
  <link rel="stylesheet" href="renderer/styles/app.css">
</head>
<body>
  <!-- G2 (shell): các block bên dưới đã migrate sang utility. Class cũ được giữ lại
       làm hook cho JS/CDP (.app-shell, .nav-item, .active, .toast, các #id) —
       quy tắc style cũ của chúng trong layout.css/responsive.css đã bị xóa. -->
  <div class="app-shell flex min-h-screen">
    <aside class="sidebar w-[252px] max-wide:w-[220px] max-tab:w-[190px] max-compact:w-16 shrink-0 flex flex-col bg-white border-r border-line pt-[26px] px-4 pb-[18px] max-tab:px-2.5 max-compact:p-[20px_7px]">
      <!-- DECISIONS #162: brand và topbar đã bỏ. Trạng thái llama.cpp, thông báo và
           hai nút toàn màn hình/hướng dẫn chuyển vào sidebar. Mọi #id giữ nguyên,
           nên ai-status.ts và phần nối thông báo trong bootstrap.ts không phải sửa;
           dropdown mở xuống dưới thanh, popover thông báo dùng position:fixed để
           không bị overflow của sidebar cắt (navigation.css). -->
      <div class="sidebar-status max-compact:hidden" data-sidebar-status>
        <div class="relative min-w-0" id="aiStatusContainer">
          <div id="aiStatusBar" class="ai-status-bar flex flex-col gap-0.5 px-2.5 py-2 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl text-[12px] shadow-sm cursor-pointer select-none transition hover:border-[#cbd5e1] hover:bg-[#f1f5f9]" data-ai-status-bar data-ai-status="bar" role="status" aria-live="polite" title="Bấm để mở menu tùy chọn llama.cpp">
            <div class="flex items-center gap-1.5 min-w-0">
              <span id="aiStatusRuntimeDot" class="ai-status-runtime-dot inline-block w-2 h-2 rounded-full bg-[#b3261e] shrink-0" data-ai-status-dot data-ai-status="dot" aria-hidden="true" hidden></span>
              <span id="aiStatusRuntime" class="ai-status-runtime font-semibold text-[#1e293b] truncate text-[12px] flex-1 min-w-0" data-ai-status="runtime">llama.cpp chưa chạy</span>
              <button type="button" id="aiStatusMenuBtn" class="ai-status-menu-btn w-5 h-5 rounded-md flex items-center justify-center text-[#4f5a6e] hover:text-[#1e293b] hover:bg-[#e2e8f0] transition shrink-0" title="Tùy chọn chức năng llama.cpp" aria-label="Tùy chọn llama.cpp">
                <span data-icon="ellipsis-vertical" data-icon-size="14"></span>
              </button>
            </div>
            <span id="aiStatusTask" class="ai-status-task text-[#4f5a6e] text-[12px] truncate hidden" data-ai-status="task">Không có tác vụ AI đang chạy</span>
          </div>
          <div id="aiStatusDropdown" class="ai-status-dropdown hidden absolute left-0 top-full mt-1 w-full bg-white border border-[#e2e8f0] rounded-xl shadow-xl z-50 p-1.5 flex flex-col gap-0.5 text-[12px]" role="menu">
            <div class="px-2 py-1 text-[12px] font-bold text-[#5a6478] border-b border-[#f1f5f9] mb-1">
              Chức năng AI local
            </div>
            <button type="button" id="aiStatusStart" class="ai-status-start w-full text-left flex items-center gap-2 px-2.5 py-1.5 rounded-lg font-semibold text-[#0f7b5c] hover:bg-[#effaf5] transition disabled:opacity-40 disabled:pointer-events-none" data-ai-status-start data-action="ai-status-start">
              <span data-icon="play" data-icon-size="12"></span> <span>Khởi động AI local</span>
            </button>
            <button type="button" id="aiStatusStop" class="ai-status-stop w-full text-left flex items-center gap-2 px-2.5 py-1.5 rounded-lg font-semibold text-[#dc2626] hover:bg-[#fef2f2] transition disabled:opacity-40 disabled:pointer-events-none" data-ai-status-stop data-action="ai-status-stop" hidden disabled>
              <span data-icon="square" data-icon-size="12"></span> <span>Dừng llama.cpp</span>
            </button>
            <button type="button" id="aiStatusCancel" class="ai-status-cancel w-full text-left flex items-center gap-2 px-2.5 py-1.5 rounded-lg font-semibold text-[#9c4808] hover:bg-[#fffbeb] transition disabled:opacity-40 disabled:pointer-events-none" data-ai-status-cancel data-action="ai-status-cancel" hidden disabled>
              <span data-icon="x" data-icon-size="12"></span> <span>Huỷ tác vụ AI</span>
            </button>
            <button type="button" id="aiStatusToggle" class="ai-status-toggle w-full text-left flex items-center gap-2 px-2.5 py-1.5 rounded-lg font-medium text-[#475569] hover:bg-[#f1f5f9] transition" data-ai-status-toggle data-action="ai-status-toggle" title="Hiện chỉ báo đỏ khi llama.cpp chưa chạy">Hiện khi rảnh</button>
            <div class="border-t border-[#f1f5f9] my-0.5"></div>
            <button type="button" id="aiStatusOpenModalBtn" class="w-full text-left flex items-center gap-2 px-2.5 py-1.5 rounded-lg font-medium text-[#4f46e5] hover:bg-[#f8f7ff] transition">
              <span data-icon="settings" data-icon-size="12"></span> <span>Cài đặt AI local…</span>
            </button>
          </div>
        </div>
        <button type="button" id="globalAiActivity" data-global-ai-activity hidden class="w-full inline-flex items-center gap-[6px] text-[12px] font-semibold text-[#6b5600] bg-[#fff8e1] border border-[#f2e3c8] py-1.5 px-[9px] rounded-lg shadow-sm" title="Mở tiến trình AI đang chạy">
          <span data-icon="loader-circle" data-icon-size="13" data-icon-class="animate-spin"></span><span data-global-ai-label class="truncate">AI đang phân tích</span><span data-global-ai-elapsed class="tabular-nums font-mono ml-auto">0:00</span>
        </button>
        <div class="sidebar-status-actions">
          <div class="relative" id="topbarNotificationContainer">
            <button type="button" class="icon-button relative w-[34px] h-[34px] border border-line rounded-[10px] bg-white text-muted transition hover:bg-[#f6f6ff] hover:text-[#4f46e5]" id="topbarNotificationBtn" title="Thông báo hệ thống">
              <span data-icon="bell" data-icon-size="16"></span>
              <span id="topbarNotificationBadge" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-[#ef4444] rounded-full border-2 border-white hidden"></span>
            </button>
            <div id="topbarNotificationPopover" class="notification-popover hidden w-[320px] bg-white border border-[#e2e8f0] rounded-xl shadow-lg z-50 p-3" role="dialog" aria-label="Thông báo">
              <div class="flex items-center justify-between pb-2 border-b border-[#f1f5f9] mb-2">
                <strong class="text-[12px] text-[#1e293b]">Thông báo hệ thống</strong>
                <button type="button" id="clearNotificationsBtn" class="text-[12px] text-[#4f46e5] hover:underline">Xoá tất cả</button>
              </div>
              <div id="topbarNotificationList" class="flex flex-col gap-2 max-h-[240px] overflow-y-auto text-[12px]">
              </div>
            </div>
          </div>
          <button class="icon-button w-[34px] h-[34px] border border-line rounded-[10px] bg-white text-muted transition hover:bg-[#f6f6ff] hover:text-[#4f46e5]" id="topbarFullscreenBtn" title="Toàn màn hình (F11)"><span data-icon="maximize" data-icon-size="16"></span></button>
          <button class="icon-button w-[34px] h-[34px] border border-line rounded-[10px] bg-white text-muted transition hover:bg-[#f6f6ff] hover:text-[#4f46e5]" id="helpBtn" title="Hướng dẫn"><span data-icon="circle-question-mark" data-icon-size="16"></span></button>
        </div>
      </div>
      <!-- DECISIONS #161: chrome icon là <span data-icon> do paintUiIcons() vẽ, không
           còn emoji gõ tay; nhãn trang trí IN HOA ("KHÔNG GIAN LÀM VIỆC",
           "LEARNING GAME BUILDER") đã bỏ. ".nav-icon" chỉ còn một class: hộp 30px,
           màu mực và nền chip do navigation.css quy định, svg thừa hưởng currentColor. -->
      <nav class="nav grid gap-[5px]">
        <button class="nav-item active flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="library"><span class="nav-icon" data-icon="library" data-icon-size="16"></span><span class="max-compact:hidden">Thư viện trò chơi</span><span class="nav-count ml-auto bg-white border border-[#e3e3fb] rounded-md px-[7px] py-[2px] text-[12px] max-compact:hidden" id="navGameCount">1</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="create-wizard" title="Nhập giáo án để AI local phân tích và gợi ý trò chơi"><span class="nav-icon" data-icon="wand-sparkles" data-icon-size="16"></span><span class="max-compact:hidden">Tạo từ giáo án</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="create" title="Tôi đã biết muốn tạo trò chơi nào"><span class="nav-icon" data-icon="shapes" data-icon-size="16"></span><span class="max-compact:hidden">Tạo trò chơi</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="lesson-plans"><span class="nav-icon" data-icon="file-text" data-icon-size="16"></span><span class="max-compact:hidden">Giáo án</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="my-projects"><span class="nav-icon" data-icon="folder-open" data-icon-size="16"></span><span class="max-compact:hidden">Dự án của tôi</span></button>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="sessions"><span class="nav-icon" data-icon="circle-fading-arrow-up" data-icon-size="16"></span><span class="max-compact:hidden">Lịch sử kết quả</span></button>
      </nav>
      <div class="sidebar-shortcuts max-compact:hidden" data-sidebar-shortcuts></div>
      <div class="sidebar-bottom mt-auto">
        <div class="offline-card flex gap-2.5 items-start py-[13px] px-3 bg-[#effaf5] border border-[#ddf4e8] rounded-[10px] mt-[14px] mx-[2px] mb-[15px] max-compact:hidden"><div class="offline-dot w-2 h-2 bg-[#1ab47f] rounded-full mt-[5px]"></div><div><strong class="block text-[12px]">Sẵn sàng ngoại tuyến</strong><small class="block text-[12px] text-[#5f6a7d] mt-1">Game đã lưu vẫn chơi được</small></div></div>
        <button class="nav-item flex items-center gap-[13px] py-3 px-[13px] rounded-[10px] text-left font-semibold bg-transparent text-[#4b5566] transition duration-150 hover:bg-[#f6f6ff] hover:text-[#4f46e5] [&.active]:bg-brand-soft [&.active]:text-[#4f46e5] max-compact:justify-center max-compact:px-0" data-page="settings"><span class="nav-icon" data-icon="settings" data-icon-size="16"></span><span class="max-compact:hidden">Cài đặt</span></button>
        <div class="profile border-t border-line mt-4 pt-[17px] px-[5px] pb-0 flex items-center gap-[9px] max-compact:justify-center"><div class="avatar w-[34px] h-[34px] rounded-[11px] bg-[#e8e6ff] text-[#4f46e5] font-extrabold grid place-items-center text-[12px]">GV</div><div class="max-compact:hidden"><strong class="block text-[12px]">Không gian giáo viên</strong><small class="block text-[12px] text-[#5f6a7d] mt-1">Máy tính này</small></div><span class="profile-more ml-auto text-[#5f6a7d] max-compact:hidden" data-icon="ellipsis-vertical" data-icon-size="15"></span></div>
      </div>
    </aside>
    <main class="main min-w-0 flex-1">
      <div id="pageContent" class="page-content max-w-[1500px] mx-auto pt-[30px] px-[34px] pb-12 max-wide:p-[25px_24px] max-compact:p-5 max-compact:px-[14px]"></div>
      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <!-- Constellation constants (DECISIONS #171). `shared.js` reads the game name
       and the retired BETA label while it paints a library card, so these names
       must exist BEFORE line 105 — the trap #168 documented. -->
  <script src="renderer/shared/constellation-constants.js"></script>
  <script src="renderer/shared.js"></script>
  <script src="renderer/features/treasure-art.js"></script>
  <script src="renderer/features/game-audio.js"></script>
  <script src="renderer/pages/library.js"></script>
  <script src="renderer/pages/create.js"></script>
  <script src="renderer/pages/sessions.js"></script>
  <script src="renderer/pages/settings.js"></script>
  <script src="renderer/pages/lesson-plans.js"></script>
  <script src="renderer/pages/my-projects.js"></script>
  <!-- State dùng chung của wizard, tách theo khu vực (DECISIONS #150). Nạp đúng
       thứ tự cũ: một số hằng số cấp cao được tính ngay lúc nạp, nên đảo thứ tự
       có thể gây "Cannot access … before initialization" (xem
       tests/unit/renderer-load-order.test.ts). -->
  <script src="renderer/features/wizard/state/core.js"></script>
  <script src="renderer/features/wizard/state/providers.js"></script>
  <script src="renderer/features/wizard/state/config.js"></script>
  <script src="renderer/features/wizard/state/draft.js"></script>
  <script src="renderer/features/wizard/state/actions.js"></script>
  <script src="renderer/features/wizard/step-structure.js"></script>
<script src="renderer/features/wizard/step-input.js"></script>
  <script src="renderer/features/wizard/step-analysis.js"></script>
  <script src="renderer/features/wizard/step-recommend.js"></script>
  <script src="renderer/features/wizard/step-configure.js"></script>
  <script src="renderer/features/wizard/step-generate.js"></script>
  <script src="renderer/pages/create-wizard.js"></script>
  <script src="renderer/features/icon-data.js"></script>
  <!-- Chrome icons (DECISIONS #161): uiIcon()/paintUiIcons() paint the Lucide SVGs
       behind every `data-icon` hook. Loads right after icon-data.js because that is
       the only copy of the node data the renderer can reach, and before render.js
       (which calls paintUiIcons) and the editor (which calls uiIcon at render). -->
  <script src="renderer/features/ui-icons.js"></script>
  <!-- Sidebar "Lối tắt" (#161): what the deleted Tổng quan page was for. Must load
       before core/render.js, which repaints the block on every render. -->
  <script src="renderer/features/sidebar-shortcuts.js"></script>
  <script src="renderer/core/render.js"></script>
  <!-- Trình soạn thảo, tách theo khu vực (DECISIONS #150). Renderer là script
       toàn cục nạp theo thứ tự, nên chỉ khai báo hàm ở đỉnh tệp; không tệp nào
       đọc biến của tệp khác lúc nạp. Thứ tự: AI → trang/lưu → câu hỏi → kéo-thả
       → matching → treasure → race. -->
  <script src="renderer/features/editor/ai.js"></script>
  <script src="renderer/features/editor/page.js"></script>
  <script src="renderer/features/editor/questions.js"></script>
  <script src="renderer/features/editor/drag.js"></script>
  <script src="renderer/features/editor/matching.js"></script>
  <script src="renderer/features/editor/treasure.js"></script>
  <script src="renderer/features/editor/race.js"></script>
  <script src="renderer/core/controller.js"></script>
  <script src="renderer/features/local-ai.js"></script>
<!-- First-run AI setup (§7): the typed, unit-tested decisions load before the
     DOM layer that renders them. -->
<script src="renderer/setup-wizard-model.js"></script>
<script src="renderer/features/setup-wizard.js"></script>
  <script src="renderer/features/game-generation.js"></script>
  <script src="game-engine/runtime.js"></script>
  <!-- House Building Mode (DECISIONS #140): pure construction/streak economy,
       loaded before games/house.js which drives the 3D house from it. -->
  <script src="game-engine/house-build.js"></script>

  <!-- Object Connection (DECISIONS #168): constants, template data and the pure
       progression. All three declare globals only, and they are loaded before
       every page/feature that renders a template (wizard step 4, editor, play
       surface), so the gallery can be built during the first render. -->
  <script src="renderer/shared/connection-constants.js"></script>
  <script src="renderer/shared/connection-data.js"></script>
  <script src="renderer/connection-core.js"></script>
  <!-- Constellation (DECISIONS #171): the seven figures, the legacy id map and
       the pure star selection. Loaded after `connection-core.js` because the star
       template is handed to that file's planner unchanged. -->
  <script src="renderer/shared/constellation-data.js"></script>
  <script src="renderer/constellation-core.js"></script>

  <script src="renderer/features/game-illustration.js"></script>

  <!-- Three.js (DECISIONS #137): bundled by scripts/build-three.js into a single
       classic <script> global `THREE`; the renderer is not ES-module and CSP is
       script-src 'self', so this must be a local IIFE, never a CDN. -->
  <script src="renderer/vendor/three.global.js"></script>

  <!-- window.threeGame: the shared, scoring-agnostic 3D presentation layer
       (DECISIONS #137). Loaded after THREE, before games/three-stage.js which calls it. -->
  <script src="renderer/features/three-game-interaction.js"></script>

  <!-- Play surface, split by responsibility (DECISIONS #147). The renderer is plain
       global scripts, so the files only declare; nothing reads another file's
       binding while loading. Order: entry → 3D → house → results → games. -->
  <script src="renderer/features/games/shell.js"></script>
  <script src="renderer/features/games/three-stage.js"></script>
  <script src="renderer/features/games/house.js"></script>
  <!-- #168: the SVG panel + gallery; quiz.js and three-stage.js call into it. -->
  <script src="renderer/features/games/connection.js"></script>
  <!-- #171: the constellation play surface (cards, chips, drops, lines). Loaded
       after connection.js because it calls its template/side helpers, and before
       matching.js which renders the board and calls into it. -->
  <script src="renderer/features/games/constellation.js"></script>
  <script src="renderer/features/games/result-screen.js"></script>
  <script src="renderer/features/games/quiz.js"></script>
  <script src="renderer/features/games/matching.js"></script>
  <script src="renderer/features/games/treasure.js"></script>
  <script src="renderer/features/games/race.js"></script>
  <script src="renderer/features/results.js"></script>
  <!-- Chơi LAN: after gameplay/results (adds the header button and the saved `lan`
       block). Before bootstrap, which calls lanInit(). -->
  <script src="renderer/features/lan.js"></script>
  <script src="renderer/features/settings.js"></script>
  <script src="renderer/features/ai-status.js"></script>
  <script src="renderer/core/bootstrap.js"></script>
  <script src="renderer/features/presentation.js"></script>
</body>
</html>
